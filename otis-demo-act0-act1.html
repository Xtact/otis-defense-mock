<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTIS // Demo — Act 0 + Act 1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#060606; overflow:hidden; height:100vh; width:100vw; }
  #stage { position:relative; width:100vw; height:100vh; background:#060606; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; }

  .grid-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;
    background-image:
      linear-gradient(rgba(232,232,232,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,232,232,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .vignette {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
  }
  #transitionOverlay {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#060606;
    opacity:0; z-index:200; pointer-events:none; transition: opacity 0.35s ease;
  }

  #titleAnchor {
    position:absolute; top:14%; left:50%; transform:translateX(-50%);
    width:88%; text-align:center; z-index:10;
    font-family:'Courier New', monospace; font-weight:bold; color:#F0F0F0;
    letter-spacing:3px; font-size:4.6rem; line-height:1.4; opacity:0;
    text-shadow: 0 0 18px rgba(232,232,232,0.25); white-space:pre-wrap;
  }
  #titleAnchor.show { opacity:1; }

  .hud {
    position:absolute; font-family:'Courier New', monospace; font-weight:bold; color:#F0F0F0;
    letter-spacing:3px; font-size:5.4rem; opacity:0; white-space:pre-wrap;
    text-align:center; line-height:1.45; text-shadow: 0 0 18px rgba(232,232,232,0.25);
  }
  .hud.show { opacity:1; }
  .hud.red { color:#FF3B30; text-shadow: 0 0 22px rgba(255,59,48,0.55); }
  .hud.green { color:#39FF88; text-shadow: 0 0 22px rgba(57,255,136,0.55); }
  .hud.small { font-size:2.6rem; }
  .hud.tiny { font-size:2.1rem; }
  .hud.micro { font-size:1.5rem; font-weight:600; letter-spacing:1px; color:#B7B7B7; text-shadow:none; }

  #liveScene { position:absolute; top:0; left:0; width:100%; height:100%; display:none; }
  #objectCanvas { z-index:5; }
  #peelCanvas { z-index:6; pointer-events:none; }
  #trackCanvas { z-index:5; }
  #hudCanvas { z-index:8; pointer-events:none; }

  .hookLabel { left:50%; transform:translateX(-50%); width:92%; text-align:center; }

  #feedTag {
    position:absolute; top:4%; left:4%; z-index:9;
    font-family:'Courier New', monospace; font-weight:bold; font-size:1.1rem; letter-spacing:2px;
    color:#8FE58F; opacity:0; text-shadow:0 0 8px rgba(143,229,143,0.6);
  }
  #feedTag.show { opacity:1; }
  #feedTag .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#FF3B30;
    margin-right:10px; box-shadow:0 0 8px rgba(255,59,48,0.8); animation: recDot 1.2s ease-in-out infinite; }
  @keyframes recDot { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  #feedClock {
    position:absolute; top:4%; right:4%; z-index:9;
    font-family:'Courier New', monospace; font-weight:bold; font-size:1.1rem; letter-spacing:2px;
    color:#8FE58F; opacity:0; text-shadow:0 0 8px rgba(143,229,143,0.6);
  }
  #feedClock.show { opacity:1; }

  #freezeOverlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(6,6,6,0.68); z-index:50; display:none;
    align-items:center; justify-content:center;
    backdrop-filter: blur(1px);
  }
  #freezeText {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    color:#F5F5F5; font-size:3.4rem; font-weight:700; line-height:1.55; text-align:center;
    max-width:1350px; padding:0 40px;
  }
  #freezeText div { opacity:0; transition:opacity 1s ease; margin-bottom:34px; }
  #freezeText div.show { opacity:1; }

  .stationLabel { text-align:center; width:620px; }
  .gateLine { position:absolute; top:50%; left:6%; width:88%; height:3px; background:#3A3A3A; z-index:4;
    box-shadow: 0 0 8px rgba(58,58,58,0.6); }

  #barrier {
    position:absolute; top:50%; left:50%; width:22px; height:190px; background:#3A3A3A;
    transform:translate(-50%,-50%); z-index:7; transition: transform 0.08s steps(1), background 0.08s steps(1), box-shadow 0.08s steps(1);
    box-shadow: 0 0 10px rgba(58,58,58,0.5);
  }
  #barrier.open { transform: translate(-50%,-50%) rotate(90deg) translateX(0px); background:#39FF88; box-shadow: 0 0 40px rgba(57,255,136,0.85); }
  #barrier.fail { background:#FF3B30; box-shadow: 0 0 40px rgba(255,59,48,0.85); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <div class="grid-overlay"></div>

  <div id="titleAnchor"></div>

  <div id="liveScene">
    <canvas id="objectCanvas" width="1920" height="1080"></canvas>
    <canvas id="peelCanvas" width="1920" height="1080"></canvas>
    <canvas id="trackCanvas" width="1920" height="1080"></canvas>
    <canvas id="hudCanvas" width="1920" height="1080"></canvas>
    <div id="feedTag"><span class="dot"></span>EO/IR FEED — LIVE</div>
    <div id="feedClock">SECTOR 7 // ALT 340M</div>
    <div class="hud small hookLabel" id="hookLabel1" style="top:58%;">NO RF EMISSION<br>DETECTED</div>
    <div class="hud small hookLabel" id="hookLabel2" style="top:70%;">NO GPS<br>CORRELATION</div>
    <div class="hud small hookLabel" id="hookLabel3" style="top:82%;">LEGACY C-UAS:<br>NO TRACK</div>
    <div class="hud" id="peelLabel" style="top:8%; left:50%; transform:translateX(-50%); width:94%; text-align:center; font-size:3.6rem;">APPEARANCE IS NEGOTIABLE.<br>GEOMETRY IS NOT.</div>
    <div class="gateLine" id="gateLine"></div>
    <div id="barrier"></div>
    <div class="hud small" id="gateFinalLabel" style="top:12%; left:50%; transform:translateX(-50%); width:94%; text-align:center;">THE GATE</div>
    <div class="hud" id="gateResultLabel" style="top:60%; left:50%; transform:translateX(-50%); width:94%; text-align:center; font-size:4.4rem;"></div>
    <div class="hud small" id="outcome1" style="top:36%; left:50%; transform:translateX(-50%); width:94%; text-align:center;">THREAT CLASS:<br>FIBER-OPTIC GUIDED FPV DRONE</div>
    <div class="hud green small" id="outcome2" style="top:54%; left:50%; transform:translateX(-50%); width:94%; text-align:center;"></div>
  </div>

  <div id="freezeOverlay">
    <div id="freezeText"></div>
  </div>
  <div class="vignette"></div>
  <div id="transitionOverlay"></div>
</div>

<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));

function typeOn(el, text, speed=90) {
  return new Promise(resolve => {
    el.innerHTML = '';
    el.classList.add('show');
    const chars = text.split('');
    let i = 0;
    let buffer = '';
    const timer = setInterval(() => {
      const ch = chars[i];
      buffer += (ch === '\n') ? '<br>' : ch;
      el.innerHTML = buffer;
      i++;
      if (i >= chars.length) { clearInterval(timer); resolve(); }
    }, speed);
  });
}

async function sceneTransition(ms=350){
  const overlay = document.getElementById('transitionOverlay');
  overlay.style.transition = `opacity ${ms}ms ease`;
  overlay.style.opacity = '1';
  await sleep(ms + 40);
  overlay.style.opacity = '0';
  await sleep(ms * 0.6);
}

async function showFreeze(lines, holdEach=6500, exitHold=2800, enterGap=1000) {
  const overlay = document.getElementById('freezeOverlay');
  const textBox = document.getElementById('freezeText');
  textBox.innerHTML = '';
  overlay.style.display = 'flex';
  for (const line of lines) {
    const div = document.createElement('div');
    div.innerHTML = line;
    textBox.appendChild(div);
    await sleep(enterGap);
    div.classList.add('show');
    await sleep(holdEach);
  }
  await sleep(exitHold);
  overlay.style.display = 'none';
}

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
function resizeBg(){ bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeBg); resizeBg();
function drawStars(){
  bgCtx.fillStyle = '#060606'; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  for (let i=0;i<180;i++){
    const x = ((Math.sin(i*12.9898)*43758.5453)%1+1)%1 * bgCanvas.width;
    const y = ((Math.sin(i*78.233)*12345.678)%1+1)%1 * bgCanvas.height;
    const r = ((Math.sin(i*45.5)*1000)%1+1)%1;
    bgCtx.fillStyle = `rgba(232,232,232,${0.05 + r*0.12})`;
    bgCtx.fillRect(x,y, r>0.85?2:1, r>0.85?2:1);
  }
}
drawStars();

const objCanvas = document.getElementById('objectCanvas');
const objCtx = objCanvas.getContext('2d');
const peelCanvas = document.getElementById('peelCanvas');
const peelCtx = peelCanvas.getContext('2d');
const trackCanvas = document.getElementById('trackCanvas');
const trackCtx = trackCanvas.getContext('2d');
const hudCanvas = document.getElementById('hudCanvas');
const hudCtx = hudCanvas.getContext('2d');

function sizeCanvases(){
  [objCanvas, peelCanvas, trackCanvas, hudCanvas].forEach(c => {
    c.width = window.innerWidth; c.height = window.innerHeight;
  });
}
window.addEventListener('resize', sizeCanvases); sizeCanvases();

function drawDroneShape(ctx, fillMode){
  const arms = [[26,22],[26,-22],[-26,-22],[-26,22]];
  ctx.lineWidth = fillMode ? 3 : 2;
  arms.forEach(([ax,ay])=>{
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(ax,ay);
    if (fillMode) ctx.strokeStyle = '#5E5E5E';
    ctx.stroke();
  });
  arms.forEach(([ax,ay])=>{
    ctx.beginPath();
    ctx.arc(ax,ay,11,0,Math.PI*2);
    if (fillMode){ ctx.fillStyle = 'rgba(110,110,110,0.35)'; ctx.fill(); ctx.strokeStyle = '#8A8A8A'; }
    ctx.stroke();
  });
  ctx.beginPath();
  ctx.moveTo(-14,-8);
  ctx.lineTo(14,-8);
  ctx.quadraticCurveTo(20,-8,20,0);
  ctx.quadraticCurveTo(20,8,14,8);
  ctx.lineTo(-14,8);
  ctx.quadraticCurveTo(-20,8,-20,0);
  ctx.quadraticCurveTo(-20,-8,-14,-8);
  ctx.closePath();
  if (fillMode){ ctx.fillStyle = '#6E6E6E'; ctx.fill(); ctx.strokeStyle = '#A6A6A6'; }
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(18,-4);
  ctx.lineTo(26,0);
  ctx.lineTo(18,4);
  ctx.closePath();
  if (fillMode){ ctx.fillStyle = '#4A4A4A'; ctx.fill(); }
  ctx.stroke();
}

function drawSolidObject(ctx, cx, cy, scale=1, alpha=1, rot=0){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  drawDroneShape(ctx, true);
  ctx.restore();
}

function drawWireframeObject(ctx, cx, cy, scale=1, alpha=1, color='#F0F0F0', rot=0){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  drawDroneShape(ctx, false);
  ctx.beginPath();
  ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function drawFiberTrail(ctx, launchX, launchY, currentX, currentY, color='#CFCFCF', alpha=1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  const spanX = currentX - launchX;
  const spanY = currentY - launchY;
  const span = Math.max(40, Math.hypot(spanX, spanY));
  const segs = Math.max(8, Math.floor(span/20));
  ctx.moveTo(launchX, launchY);
  for (let i=1;i<=segs;i++){
    const t = i/segs;
    const x = launchX + spanX*t;
    const y = launchY + spanY*t;
    const wob = Math.sin(t*16 + span*0.01) * 4 * (1 - Math.abs(t-0.5)*0.6);
    ctx.lineTo(x, y + wob);
  }
  ctx.stroke();
  ctx.restore();
}

function drawReticle(ctx, cx, cy, t, radius=90){
  ctx.save();
  ctx.strokeStyle = 'rgba(143,229,143,0.85)';
  ctx.lineWidth = 1.6;
  ctx.shadowColor = '#8FE58F';
  ctx.shadowBlur = 6;
  const pulse = 1 + Math.sin(t*2)*0.03;
  ctx.beginPath();
  ctx.arc(cx, cy, radius*pulse, 0, Math.PI*2);
  ctx.stroke();
  const cornerLen = 16;
  const r2 = radius*1.25;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
    const bx = cx + sx*r2, by = cy + sy*r2;
    ctx.beginPath();
    ctx.moveTo(bx - sx*cornerLen, by);
    ctx.lineTo(bx, by);
    ctx.lineTo(bx, by - sy*cornerLen);
    ctx.stroke();
  });
  ctx.restore();
}

function drawScanSweep(ctx, w, h, t){
  const y = ((t*70) % (h+120)) - 60;
  const grad = ctx.createLinearGradient(0, y-40, 0, y+40);
  grad.addColorStop(0, 'rgba(232,232,232,0)');
  grad.addColorStop(0.5, 'rgba(232,232,232,0.05)');
  grad.addColorStop(1, 'rgba(232,232,232,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y-40, w, 80);
}

const centerX = () => window.innerWidth*0.58;
const centerY = () => window.innerHeight*0.34;
const TAIL_OFFSET = 20;

async function flyDroneIn(){
  const cy = centerY();
  const restX = centerX();
  const startX = -180;
  const launchX = -40;
  const duration = 2600;
  const t0 = performance.now();
  return new Promise(resolve => {
    function step(){
      const now = performance.now();
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const x = startX + (restX - startX) * eased;
      const bobY = cy + Math.sin(p * Math.PI * 3) * 6;

      objCtx.clearRect(0,0,objCanvas.width,objCanvas.height);
      drawFiberTrail(objCtx, launchX, cy, x - TAIL_OFFSET, bobY, '#8A8A8A', 0.9);
      drawSolidObject(objCtx, x, bobY, 2.2, 1, 0);

      if (p < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

async function runHookScene(){
  document.getElementById('liveScene').style.display = 'block';
  await typeOn(document.getElementById('feedTag'), 'EO/IR FEED — LIVE', 40);
  document.getElementById('feedClock').classList.add('show');
  document.getElementById('feedClock').textContent = 'SECTOR 7 // ALT 340M';

  await flyDroneIn();

  const cx = centerX(), cy = centerY();
  const launchX = -40;
  const startTime = performance.now();
  let running = true;

  const animate = () => {
    if (!running) return;
    const t = (performance.now() - startTime) / 1000;
    const driftX = Math.sin(t*0.6) * 10;
    const driftY = Math.cos(t*0.9) * 5;
    const rot = Math.sin(t*0.5) * 0.02;

    objCtx.clearRect(0,0,objCanvas.width,objCanvas.height);
    drawFiberTrail(objCtx, launchX, cy, cx+driftX-TAIL_OFFSET, cy+driftY, '#8A8A8A', 0.9);
    drawSolidObject(objCtx, cx+driftX, cy+driftY, 2.2, 1, rot);

    hudCtx.clearRect(0,0,hudCanvas.width,hudCanvas.height);
    drawScanSweep(hudCtx, hudCanvas.width, hudCanvas.height, t);
    drawReticle(hudCtx, cx+driftX, cy+driftY, t);

    requestAnimationFrame(animate);
  };
  animate();

  await sleep(1200);
  await typeOn(document.getElementById('hookLabel1'), 'NO RF EMISSION\nDETECTED', 90);
  await sleep(1800);
  await typeOn(document.getElementById('hookLabel2'), 'NO GPS\nCORRELATION', 90);
  await sleep(1800);
  await typeOn(document.getElementById('hookLabel3'), 'LEGACY C-UAS:\nNO TRACK', 90);
  await sleep(3200);

  running = false;
  hudCtx.clearRect(0,0,hudCanvas.width,hudCanvas.height);
}

async function runPeelReveal(){
  const label = document.getElementById('peelLabel');
  label.classList.add('show');
  label.innerHTML = 'APPEARANCE IS NEGOTIABLE.<br>GEOMETRY IS NOT.';

  const cx = centerX(), cy = centerY();
  const launchX = -40;
  const steps = 90;
  for (let s=0; s<=steps; s++){
    const p = s/steps;
    objCtx.clearRect(0,0,objCanvas.width,objCanvas.height);
    drawFiberTrail(objCtx, launchX, cy, cx-TAIL_OFFSET, cy, '#8A8A8A', 1-p*0.3);
    drawSolidObject(objCtx, cx, cy, 2.2, 1-p);

    peelCtx.clearRect(0,0,peelCanvas.width,peelCanvas.height);
    peelCtx.save();
    peelCtx.globalAlpha = Math.min(0.95, p*1.3);
    for (let i=0;i<260;i++){
      const ang = (i/260)*Math.PI*2;
      const dist = p*170;
      const px = cx + Math.cos(ang)*(50+dist) + (Math.random()-0.5)*18;
      const py = cy + Math.sin(ang)*(24+dist*0.55) + (Math.random()-0.5)*18;
      const size = 1.4 + Math.random()*1.6;
      peelCtx.fillStyle = i%3===0 ? '#F0F0F0' : '#9A9A9A';
      peelCtx.fillRect(px, py, size, size);
    }
    peelCtx.restore();

    drawWireframeObject(objCtx, cx, cy, 2.2, p);
    drawFiberTrail(objCtx, launchX, cy, cx-TAIL_OFFSET, cy, '#F0F0F0', p);
    await sleep(30);
  }
  await sleep(2200);
  peelCtx.clearRect(0,0,peelCanvas.width,peelCanvas.height);

  await sleep(1000);
  await typeOn(label, 'NOT A PICTURE.\nA SHAPE.', 110);
  await sleep(2600);
  label.classList.remove('show');
}

const stations = [
  { frac:0.20, name:'OUTLINE', result:'A SHAPE\nEMERGES' },
  { frac:0.42, name:'MOTION',  result:'MOVEMENT\nHOLDS TOGETHER' },
  { frac:0.64, name:'STRUCTURE', result:'A REAL\nTHREE-DIMENSIONAL FORM' },
  { frac:0.86, name:'MATCH', result:'CONFIRMED AGAINST THE\nTHREAT MODEL CATALOG\u2122' },
];

function drawTrackStatic(pulsePhase=0){
  trackCtx.clearRect(0,0,trackCanvas.width,trackCanvas.height);
  const y = window.innerHeight*0.5;
  trackCtx.strokeStyle = '#3A3A3A';
  trackCtx.lineWidth = 3;
  trackCtx.shadowColor = '#3A3A3A';
  trackCtx.shadowBlur = 6;
  trackCtx.beginPath();
  trackCtx.moveTo(window.innerWidth*0.06, y);
  trackCtx.lineTo(window.innerWidth*0.94, y);
  trackCtx.stroke();
  stations.forEach((st,idx) => {
    const x = window.innerWidth*(0.06 + st.frac*0.88);
    const pulse = 0.5 + 0.5*Math.sin(pulsePhase + idx);
    trackCtx.strokeStyle = '#4A4A4A';
    trackCtx.beginPath();
    trackCtx.arc(x, y, 10 + pulse*3, 0, Math.PI*2);
    trackCtx.stroke();
    trackCtx.beginPath();
    trackCtx.moveTo(x, y-26);
    trackCtx.lineTo(x, y+26);
    trackCtx.stroke();
  });
}

async function runVerificationWalk(freezeAfter1, freezeAfter3){
  document.getElementById('gateLine').style.display='none';
  const y = window.innerHeight*0.5;
  const startX = window.innerWidth*0.06;
  const endX = window.innerWidth*0.94;

  const stationLabel = document.createElement('div');
  stationLabel.className = 'hud tiny stationLabel show';
  stationLabel.style.top = (y/window.innerHeight*100 - 22) + '%';
  document.getElementById('liveScene').appendChild(stationLabel);

  const resultLabel = document.createElement('div');
  resultLabel.className = 'hud micro stationLabel show';
  resultLabel.style.top = (y/window.innerHeight*100 + 12) + '%';
  document.getElementById('liveScene').appendChild(resultLabel);

  let stIdx = 0;
  const totalDurationMs = 14000;
  const frames = 140;
  for (let f=0; f<=frames; f++){
    const p = f/frames;
    const x = startX + (endX-startX)*p;
    drawTrackStatic(f*0.15);
    drawFiberTrail(trackCtx, startX, y, x-TAIL_OFFSET, y, '#CFCFCF', 1);
    drawWireframeObject(trackCtx, x, y, 1.05, 1);

    if (stIdx < stations.length){
      const stX = window.innerWidth*(0.06 + stations[stIdx].frac*0.88);
      if (x >= stX){
        stationLabel.style.left = stX + 'px';
        stationLabel.style.transform = 'translateX(-50%)';
        resultLabel.style.left = stX + 'px';
        resultLabel.style.transform = 'translateX(-50%)';
        await typeOn(stationLabel, stations[stIdx].name, 85);
        await sleep(1200);
        await typeOn(resultLabel, stations[stIdx].result, 55);
        await sleep(3000);

        if (stIdx === 0 && freezeAfter1){
          await showFreeze([
            'This first step reveals the outline<br>of the object — its silhouette.',
            'No color, no texture.<br>Just shape.'
          ]);
        }
        if (stIdx === 2 && freezeAfter3){
          await showFreeze([
            'Here, the outline becomes a real 3-D shape<br>and gets compared against the<br>Threat Model Catalog\u2122 —',
            'a library of known threat geometries,<br>built from physics, not photographs.'
          ]);
        }
        stIdx++;
        stationLabel.classList.remove('show');
        resultLabel.classList.remove('show');
        await sleep(800);
      }
    }
    await sleep(totalDurationMs/frames);
  }
  stationLabel.remove();
  resultLabel.remove();
}

async function runDecisionGate(pass=true){
  trackCtx.clearRect(0,0,trackCanvas.width,trackCanvas.height);
  const finalLabel = document.getElementById('gateFinalLabel');
  const resultLabel = document.getElementById('gateResultLabel');
  const barrier = document.getElementById('barrier');
  barrier.style.display = 'block';
  barrier.style.top = '50%';

  await typeOn(finalLabel, 'THE GATE', 100);
  await sleep(2600);

  if (pass){
    barrier.classList.add('open');
    resultLabel.classList.add('green');
    await typeOn(resultLabel, 'PASS \u2192 CLASSIFIED', 110);
  } else {
    barrier.classList.add('fail');
    resultLabel.classList.add('red');
    await typeOn(resultLabel, 'FAIL \u2192 ZERO', 110);
  }
  await sleep(3200);
}

async function runOutcome(){
  document.getElementById('barrier').style.display='none';
  document.getElementById('gateFinalLabel').classList.remove('show');
  document.getElementById('gateResultLabel').classList.remove('show');
  const o1 = document.getElementById('outcome1');
  const o2 = document.getElementById('outcome2');
  await typeOn(o1, 'THREAT CLASS:\nFIBER-OPTIC GUIDED FPV DRONE', 95);
  await sleep(1600);
  await typeOn(o2, 'VERDICT: HOSTILE\nGEOMETRY CONFIRMED', 95);
  await sleep(3600);
}

async function runAct0(){
  const title = document.getElementById('titleAnchor');

  await typeOn(title, "EVERY CAMERA.\nEVERY RADAR.\nEVERY GPS RECEIVER.", 80);
  await sleep(2200);
  await typeOn(title, "TRUSTS INPUTS\nTHE ADVERSARY CONTROLS.", 80);
  await sleep(2600);

  title.classList.remove('show');
  await sleep(250);

  await typeOn(title, "OTIS DOESN'T.", 90);
  await sleep(2000);
  title.classList.remove('show');

  await sceneTransition(400);
}

async function runAct1(){
  await runHookScene();
  await showFreeze([
    'Fiber-optic guided drones trail a physical wire<br>instead of transmitting a signal.',
    'There is nothing to intercept.<br>Nothing to jam. Nothing to spoof.',
    'Every RF-based defense system is<br>structurally blind to this threat class.'
  ]);

  document.getElementById('hookLabel1').classList.remove('show');
  document.getElementById('hookLabel2').classList.remove('show');
  document.getElementById('hookLabel3').classList.remove('show');
  document.getElementById('feedTag').classList.remove('show');
  document.getElementById('feedClock').classList.remove('show');

  await runPeelReveal();
  await showFreeze([
    "OTIS never asked what this object looks like.",
    "It measures what the object physically is —<br>shape, structure, how it moves.",
    "That can't be faked<br>the way a picture can."
  ]);

  objCtx.clearRect(0,0,objCanvas.width,objCanvas.height);
  await sceneTransition(350);
  await runVerificationWalk(true, true);

  await sceneTransition(350);
  await runDecisionGate(true);
  await showFreeze([
    'This gate allows only two outcomes:<br>confirmed, or rejected. Nothing in between.',
    'No confidence score. No "maybe."<br>A percentage can be argued with — this can\'t.'
  ]);

  await sceneTransition(350);
  await runOutcome();
  await sceneTransition(700);
}

async function main(){
  await runAct0();
  document.getElementById('liveScene').style.display='block';
  await runAct1();
}

main();
</script>
